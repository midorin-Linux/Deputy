[package]
name = "deputy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
async-openai = { version = "0.42", features = ["chat-completion"] }
async-trait = "0.1"
backoff = { version = "0.4", features = ["tokio"] }
base64 = "0.23"
chrono = "0.4"
colored = "3"
config = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
indicatif = "0.18"
rand = "0.10"
# CryptoProvider明示用（依存ツリーに既に存在。featureはring選択のみ）
rustls = { version = "0.23", default-features = false, features = ["ring"] }
secrecy = "0.10"
serenity = { version = "0.12", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
songbird = { version = "0.6.0", features = ["builtin-queue"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
symphonia = { version = "0.6", features = ["wav", "pcm"] }

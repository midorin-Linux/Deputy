env:
  # debug | info | warn | error
  log_level: info

discord:
  token: "YOUR_DISCORD_BOT_TOKEN"

ai:
  # -----プロバイダー設定-----
  api_key: YOUR_API_KEY_HERE
  # https://api.openai.com/v1 -> https://api.openai.com/v1/models
  base_url: https://api.openai.com/v1
  model_id: gpt-oss-20b

  # AIプロバイダへのリクエストタイムアウト（秒）。ハング時に判定が無期限ブロックするのを防ぐ。デフォルト300
  request_timeout_secs: 300

  # -----モデル設定-----
  support_image: false

features:
  member_log:
    enabled: true
    log_channel: 123456789012345678
    # アカウント作成からこの日数未満なら新規垢として警告色で通知する
    new_account_warn_days: 7

  voice_log:
    enabled: true
    log_channel: 123456789012345678

  tts:
    enabled: false

    # VOICEVOX ENGINEのベースURL。ENGINEを起動しておく必要がある
    voicevox_url: http://127.0.0.1:50021

    # /speaker で個別に設定していないユーザーに使う話者ID
    default_speaker: 3

    # 1メッセージあたりの読み上げ文字数の上限。超えた分は切り捨てる
    max_chars: 120

    # VOICEVOX ENGINEへのリクエストタイムアウト（秒）
    request_timeout_secs: 30

  honeypot:
    enabled: false
    # BAN実行・AI判定失敗を通知する管理者向けチャンネル
    log_channel: 123456789012345678

    # 監視対象のハニーポットチャンネルID（複数指定可）
    honeypot_channels: [123456789012345678]

    # 特別な理由がない限り、本番環境では有効(true)にしないでください。
    # 実際のBANを行わず、判定結果の通知だけを行う検証モードになります。
    debug_mode: false

    # 監視チャンネルへ投稿したアカウントを、ban_triggerもAI判定も一切問わず即BANする。
    # 強力なため既定は無効(false)。有効にすると他の条件より優先される。
    unconditional_ban: false

    # AIにスパム判定をさせるかどうか。falseならban_triggerの条件のみで判断する
    enable_ai_judgment: true

    # BAN時にさかのぼって削除するメッセージの日数（Discord仕様で0〜7）
    delete_message_days: 3

    # このロールを持つメンバーは判定対象外（管理者・モデレータの誤BAN防止）
    exempt_roles: []

    # AI判定より前に評価される高速フィルタ
    ban_trigger:
      # 招待リンクが含まれている場合( discord.gg/* | discord.com/invite/* | discordapp.com/invite/* )
      has_invite_link: true
      # 全体メンションまたはロールメンションが含まれている場合
      has_role_mention: true
      # メンション数の閾値(0でオフ)
      mention_threshold: 3

    # AI判定に失敗したときの扱い。
    # skip   = エラーログのみ残して見逃す
    # notify = 見逃したうえでlog_channelへ警告を通知する（既定）
    ai_failure_policy: notify
